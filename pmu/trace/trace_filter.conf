# Trace filter configuration.

############################ Trace parameters ############################
# All key=value parameters must appear before the first [xxx] filter section.

# TraceLog severity threshold. Applies to both the native trace pipeline
# (trace.log) and the Java trace agent log.
# Valid values: error, warning, info, debug. Default: info.
# error   - only failures.
# warning - failures and recoverable degradation notices.
# info    - session markers, filter status, and warnings (default).
# debug   - everything above plus verbose diagnostics (raw stream stats,
#           hex page prefixes, symbol resolution counts, per-class
#           instrumentation details). Use this only when investigating
#           trace collection issues.
log_level=info

############################ Java trace parameters ############################

# Shared-memory ring layout (ABI v4). Events are written into lock-light per-CPU ring
# buffers (one ring per usable CPU of the target process), removing the global sequence
# CAS contention of earlier versions that distorted instrumented timestamps.
# The ring count is not configurable: it equals the target process's available CPUs.

# Slot entries per ring, each 64 bytes. Valid range: 1-4194304. Default: 327680 (20 MB/ring).
# A ring wraps only when one CPU bucket emits more than slots_per_ring events between two
# consumer drains. Estimate: worst_case_events_per_second_per_cpu * read_interval_seconds.
# For example, 500k events/s with a 1 s drain interval needs 500000 slots.
# If trace.log reports "consumer lagged behind" (overwritten > 0), events were overwritten
# before being read: increase this value or shorten the trace read interval.
# Shared-memory usage: usable_cpus * slots_per_ring * 64 bytes plus about 60 MB metadata.
slots_per_ring=327680

# Number of rings (one per CPU bucket). Default: -1, auto-sized from the target process's
# affinity CPU count. Valid values: -1 or 1-65536. A configured value greater than the
# affinity CPU count is clamped down to it, so setting this can only reduce, never grow,
# the ring range (use a smaller value to save shared memory).
# Shared-memory usage: ring_count * slots_per_ring * 64 bytes plus about 60 MB metadata.
ring_count=-1

# Java call-graph context expansion depth. Valid range: 0-5.
# The total number of additional methods is limited by 'context_max_methods'.
# 0 disables expansion and instruments only UTraceAttr, devopt record and [java_include] matches.
# Values greater than 0 may add caller/callee methods around matched methods.
context_depth=0

# Upper limit for additional methods produced by call-graph context expansion shared by all directly matched methods
# Valid range: 0-4096. 0 disables context expansion. Default: 128.
context_max_methods=128

# Enable virtual thread stage collection. Default: false.
# When enabled, records virtual thread lifecycle stages (run, dequeue, poll, wakeup)
# alongside regular method trace events.
# It can also be enabled per session via UTraceAttr.vtStage / kperf.UTraceAttr.VTStage /
# pmu.UTraceAttr(vtStage=...); that takes precedence over this setting.
vt_stage=false

############################ Native trace parameters ############################

# Sampling period for native entry and return probes. Default: 4000.
native_sample_period=4000

############################ Kernel trace parameters ############################

# Per-CPU ftrace ring-buffer size used by trace_pipe_raw, in KiB.
# Default: 1024. Valid range: 1-16384. Total allocation scales with online CPUs.
kernel_ftrace_buffer_size_kb=1024

# Whether function_graph records selected functions running in interrupt context.
kernel_ftrace_irqs=true

############################ Java trace filters ############################

# Java rule syntax. Please refer to the following input format:
#   com.example.service.*
#       Match classes directly in com.example.service, but not subpackages.
#   com.example.service.**
#       Match classes in com.example.service and all nested subpackages.
#   com.example.Foo
#       Match every eligible method declared by this exact class.
#   com.example.Foo::bar
#       Match method bar in class com.example.Foo, any descriptor.
#   com.example.Foo::ba*
#       Match methods whose names start with ba in class com.example.Foo.
#   com.example.Foo::bar(Ljava/lang/String;)V
#       Match method bar with the exact JVM method descriptor.

# Additional classes or methods to instrument besides UTraceAttr symbols.
[java_include]


# Java classes or methods excluded from instrumentation with the highest priority.
[java_exclude]

# Agent and trace runtime
com.libkperf.tracex.**
# high-frequency JDK infrastructure
java.lang.**
java.util.**
java.io.**
java.nio.**
java.net.**
java.lang.instrument.**
# Internal JDK implementation packages are unstable and frequently contain VM/native bridge code.
jdk.**
sun.**
com.sun.**
# Bytecode transformation frameworks may run while classes are being loaded or retransformed
org.objectweb.asm.**
net.bytebuddy.**
javassist.**

############################ Native trace filters ############################

# Native C, C++ and Go trace filters.
# Include formats:
#   function_name
#       Resolve an exact symbol from the target process mappings; exactly one ELF module must match.
#       Wildcard characters are not supported for automatic module resolution.
#   /absolute/path/to/module.so::function_name
#       Select an exact module explicitly, e.g. /opt/app/lib/libmath.so::math_phase_one.
# Exclude Format: function_name or /absolute/path/to/module.so::function_name

[native_include]


[native_exclude]


############################ Kernel trace filters ############################

# Rules are kernel function-name patterns, for example do_futex or __arm64_sys_*.

[kernel_include]

[kernel_exclude]
# Exclude tracing internals, process termination paths, and scheduler switch internals by default
*ftrace*
ring_buffer_*
do_exit
panic
__switch_to*
finish_task_switch*

# Default exclusions for high-frequency low-level functions
__schedule
schedule
_raw_spin_*
preempt_*
ktime_get*
sched_clock*
printk*
