plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow'
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveBaseName = 'trace_agent'
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    // The agent can be loaded into applications which already provide a different
    // ASM version (for example Flink and Hive). Keep the agent's ASM private so
    // parent-first class loading cannot bind agent code to the application's ASM.
    relocate 'org.objectweb.asm', 'com.libkperf.tracex.shaded.asm'

    manifest {
        attributes(
            'Premain-Class': 'com.libkperf.tracex.agent.TraceAgent',
            'Agent-Class': 'com.libkperf.tracex.agent.TraceAgent',
            'Can-Retransform-Classes': 'true',
            'Can-Redefine-Classes': 'true'
        )
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.register('verifyAsmIsolation') {
    dependsOn tasks.named('shadowJar')

    doLast {
        def agentJar = tasks.named('shadowJar').get().archiveFile.get().asFile
        def contents = zipTree(agentJar)
        def privateAsm = contents.matching {
            include 'com/libkperf/tracex/shaded/asm/ClassVisitor.class'
        }.files
        def exposedAsm = contents.matching {
            include 'org/objectweb/asm/**'
        }.files

        if (privateAsm.isEmpty()) {
            throw new GradleException("Private ASM classes are missing from ${agentJar}")
        }
        if (!exposedAsm.isEmpty()) {
            throw new GradleException("Unrelocated ASM classes are present in ${agentJar}")
        }

        def agentClass = contents.matching {
            include 'com/libkperf/tracex/agent/TraceAgent.class'
        }.singleFile
        byte[] classBytes = agentClass.bytes
        int majorVersion = ((classBytes[6] & 0xff) << 8) | (classBytes[7] & 0xff)
        if (majorVersion != 52) {
            throw new GradleException("Agent must use Java 8 bytecode, found class major version ${majorVersion}")
        }

        def jarFile = new java.util.jar.JarFile(agentJar)
        try {
            def attributes = jarFile.manifest.mainAttributes
            def expectedManifest = [
                'Premain-Class': 'com.libkperf.tracex.agent.TraceAgent',
                'Agent-Class': 'com.libkperf.tracex.agent.TraceAgent',
                'Can-Retransform-Classes': 'true',
                'Can-Redefine-Classes': 'true'
            ]
            expectedManifest.each { key, value ->
                if (attributes.getValue(key) != value) {
                    throw new GradleException("Invalid ${key} in ${agentJar}")
                }
            }
        } finally {
            jarFile.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAsmIsolation')
}

// build thread info native lib
def defaultNativeOutDir = file("${rootProject.projectDir}/../../build/lib/java")
def nativeOutDir = providers
    .gradleProperty("libkperfNativeOutDir")
    .orElse(providers.gradleProperty("libkperfJavaOutDir"))
    .map { file(it) }
    .orElse(defaultNativeOutDir)

def nativeLib = nativeOutDir.map {
    new File(it, "libtracex_threadinfo.so")
}

tasks.register("buildNativeThreadInfo", Exec) {
    def javaHome = org.gradle.internal.jvm.Jvm.current().javaHome.absolutePath

    inputs.file("${projectDir}/src/main/native/tracex_threadinfo.c")
    outputs.file(nativeLib)

    doFirst {
        def outDir = nativeOutDir.get()
        def outLib = nativeLib.get()
        outDir.mkdirs()

        commandLine "bash", "-c", """
            set -e
            gcc -shared -fPIC -D_GNU_SOURCE -Wl,-z,relro,-z,now -ftrapv\\
              -fstack-protector-all -D_FORTIFY_SOURCE=2 -O2 -s \\
              -I'${javaHome}/include' \\
              -I'${javaHome}/include/linux' \\
              '${projectDir}/src/main/native/tracex_threadinfo.c' \\
              -o '${outLib.absolutePath}'
        """

        println "[trace_agent] native lib output: ${outLib.absolutePath}"
    }
}

tasks.named("shadowJar") {
    dependsOn tasks.named("buildNativeThreadInfo")
}
